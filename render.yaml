# Render Blueprint, see https://render.com/docs/blueprint-spec
services:
  - type: web
    name: genialtanken-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy only after all GitHub checks of the commit passed (aggregate check "CI success").
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - .dockerignore
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # Origins of the web app that CORS allows, comma-separated: the new static hosting and, until
      # the move is done, the former Worker address (remove it afterwards).
      - key: WEB_ORIGIN
        value: https://genial-tanken.appool.de,https://genialtanken.alexf090.workers.dev
