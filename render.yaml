# Render Blueprint, see https://render.com/docs/blueprint-spec
services:
  - type: web
    name: genialtanken-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy only after all GitHub checks of the commit passed (aggregate check "CI success").
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - .dockerignore
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # Same value as the secret PROXY_SHARED_SECRET of the Cloudflare Worker `genialtanken`; lets
      # the Worker pass the client address on for per-client rate limiting (at least 32 characters)
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: WEB_ORIGIN
        value: https://genialtanken.alexf090.workers.dev
