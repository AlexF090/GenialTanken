packages:
  - apps/*
  - packages/*
  - e2e

saveExact: true
# No engineStrict: Dependabot's updater runs Node 24 and would abort on `engines.node`.
# .nvmrc, CI and the dev container enforce Node 26.
# Minutes a release must be public before it can be installed (supply-chain protection)
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  # Local runtime of wrangler for `wrangler dev`
  workerd: true
  msgpackr-extract: true
  # Telemetry from swagger-ui-dist
  '@scarf/scarf': false
  # Binary comes from its platform package; the postinstall would only install the hooks again
  lefthook: false

overrides:
  # @nestjs/platform-express 12.2.0 still pins multer 2.4.0 (GHSA-q7qp-rjg7-q26m, fixed in 2.5.0)
  multer: 2.5.0
  # express 5.3.0 allows ^2.3.0; 2.3.x is vulnerable (GHSA-27r3-jxmh-p828, fixed in 2.4.0)
  body-parser: 2.4.0
