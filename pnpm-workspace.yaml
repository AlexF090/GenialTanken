packages:
  - apps/*
  - packages/*
  - e2e
  # Legacy React app, removed once the Angular rewrite reaches feature parity
  - client
  - server

saveExact: true
engineStrict: true
# Minutes a release must be public before it can be installed (supply-chain protection)
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  # Telemetry from swagger-ui-dist
  '@scarf/scarf': false
  core-js: false
  core-js-pure: false
