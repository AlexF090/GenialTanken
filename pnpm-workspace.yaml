packages:
  - apps/*
  - packages/*
  - e2e

saveExact: true
# No engineStrict: Dependabot's updater runs Node 24 and would abort on `engines.node`.
# .nvmrc, CI and the dev container enforce Node 26.
# Minutes a release must be public before it can be installed (supply-chain protection)
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  # Local runtime of wrangler for `wrangler dev`
  workerd: true
  msgpackr-extract: true
  # Telemetry from swagger-ui-dist
  '@scarf/scarf': false
  # Binary comes from its platform package; the postinstall would only install the hooks again
  lefthook: false
