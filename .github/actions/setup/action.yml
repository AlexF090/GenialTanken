name: Setup workspace
description: Install pnpm (version from devEngines.packageManager in package.json), Node.js from .nvmrc and all workspace dependencies.

runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup >= v6 reads devEngines.packageManager
    # from package.json, so package.json stays the single source of truth.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # .nvmrc names only the major version; without this the runner's cached Node.js may lag
        # behind the latest security release.
        check-latest: true
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
