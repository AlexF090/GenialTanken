name: Setup workspace
description: Install pnpm (version from devEngines.packageManager in package.json), Node.js from .nvmrc and all workspace dependencies.

runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup >= v6 reads devEngines.packageManager
    # from package.json, so package.json stays the single source of truth.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
