name: Deploy Worker

# Deploys the Cloudflare Worker `genialtanken`, which only redirects the old workers.dev address
# to the web app and keeps the Render API awake (apps/web/worker/). The web app itself is
# deployed to Hetzner by deploy-web.yml.
#
# Runs after "Deploy web" succeeded, so the old address only starts redirecting once the app is
# live on the new one (workflow_run always uses the workflow definition from the default
# branch). Security model: workflow_run has access to secrets, so it only reacts to successful
# runs of Deploy web, which itself only follows CI runs of pushes to `main`, never pull requests,
# and takes the Worker sources and the wrangler configuration from the
# default branch. wrangler bundles the Worker with esbuild (no execution); a `build` section in
# the configuration would run a shell command with the deploy secrets, so the script
# `verify-wrangler-configuration.ts` rejects it.
on:
  workflow_run:
    workflows: [Deploy web]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Sparse checkout of the Worker from the default branch.
      contents: read
    environment:
      name: production
      url: https://genial-tanken.appool.de
    steps:
      - name: Check out the Worker from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .nvmrc
            apps/web/wrangler.jsonc
            apps/web/worker
            scripts/verify-wrangler-configuration.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify wrangler configuration
        run: node scripts/verify-wrangler-configuration.ts apps/web/wrangler.jsonc

      # --keep-vars: API_ORIGIN is set in Cloudflare, not in wrangler.jsonc; without the flag
      # wrangler would drop it from the new version. Secrets are kept either way.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.144.0
          workingDirectory: apps/web
          command: deploy --config=wrangler.jsonc --keep-vars
