name: Deploy web

# Uploads the web app to the Hetzner Webhosting (Apache, static) at
# https://genial-tanken.appool.de by SFTP. The API on Render and the redirect Worker are deployed
# separately (Render itself, deploy-worker.yml).
#
# Runs after CI finished on the default branch's copy of this file (workflow_run always uses the
# workflow definition from the default branch).
#
# Security model: workflow_run executes in the context of the base repository and has access to
# secrets. This workflow therefore never checks out or executes code from the triggering ref. It
# only downloads the `web-dist` artifact that the successful CI run of a push to `main` produced
# (the built app with its generated .htaccess), checks its shape and uploads it. Pull requests
# are never deployed and have no preview.
#
# The SFTP user is restricted in konsoleH to the web directory of the subdomain, so the server
# root is the target. `mirror --delete` removes everything on the server that is not in the
# build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-web
  # A running upload is never cancelled; a half upload would leave the app without its scripts.
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload and verify
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Download the artifact of the triggering CI run.
      actions: read
    environment:
      name: production
      url: https://genial-tanken.appool.de
    steps:
      - name: Download web build from CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify artifact contents
        working-directory: web-dist
        run: |
          for required in index.html ngsw.json ngsw-worker.js manifest.webmanifest .htaccess; do
            if [ ! -s "${required}" ]; then
              echo "::error::${required} is missing or empty in the web build."
              exit 1
            fi
          done
          unexpected="$(find . \( -type l -o -name '*.map' -o -name '.env*' -o -name 'wrangler.*' -o -name 'package.json' \))"
          if [ -n "${unexpected}" ]; then
            echo "::error::Unexpected files in the web build: ${unexpected}"
            exit 1
          fi
          # The policy must name the API the build calls and the redirect to the legal notice must be there.
          grep -q "connect-src 'self' https://genialtanken-api.onrender.com" .htaccess
          grep -q '^Redirect 301 /impressum https://appool.de/impressum$' .htaccess

      # Blocks placeholders and draft markers in the finished app.
      - name: Refuse to publish placeholders
        working-directory: web-dist
        run: |
          if grep -rnEi --include='*.html' --include='*.js' --include='*.json' 'PLATZHALTER|ENTWURF|\[TODO\]' .; then
            echo "::error::The web build contains placeholders or draft markers; resolve them before publishing."
            exit 1
          fi

      - name: Install lftp
        # Try without apt-get update first (saves time), update only when the package index is stale.
        run: |
          sudo apt-get install --yes --no-install-recommends lftp \
            || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends lftp; }

      - name: Upload by SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          # lftp reads the password from LFTP_PASSWORD with --env-password; it never appears in
          # a script or on the command line.
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit true
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          set net:max-retries 2
          set net:timeout 30
          open --env-password -p ${SFTP_PORT:-22} -u "$SFTP_USER" sftp://$SFTP_HOST
          mirror --reverse --delete --verbose web-dist/ ./
          bye
          EOF
          lftp -f "$RUNNER_TEMP/upload.lftp"
          rm -f "$RUNNER_TEMP/upload.lftp"

      # Expectations follow apps/web/hosting/htaccess.ts: HTTPS, the legal notice on appool.de,
      # client routes get index.html with status 200, the service worker files are revalidated.
      - name: Smoke test
        run: |
          fetch_headers() {
            curl --silent --show-error --head --output - \
              --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$1"
          }
          check() {
            local url="$1" status="$2" header_pattern="$3" headers
            headers="$(fetch_headers "$url" | tr -d '\r')"
            if ! printf '%s\n' "$headers" | head -n 1 | grep -qE "^HTTP/[0-9.]+ $status"; then
              echo "::error::$url: expected status $status, got: $(printf '%s\n' "$headers" | head -n 1)"
              exit 1
            fi
            if [ -n "$header_pattern" ] && ! printf '%s\n' "$headers" | grep -qiE "$header_pattern"; then
              echo "::error::$url: no header matches $header_pattern"
              exit 1
            fi
            echo "ok: $url ($status)"
          }
          # Short wait until the server serves the new files together with the .htaccess.
          sleep 10
          check https://genial-tanken.appool.de/ 200 '^content-security-policy:.*connect-src'
          check https://genial-tanken.appool.de/ 200 '^strict-transport-security:'
          check http://genial-tanken.appool.de/ 301 '^location: https://genial-tanken\.appool\.de/$'
          # A client route: the fallback serves index.html.
          check https://genial-tanken.appool.de/favorites 200 '^content-type: text/html'
          check https://genial-tanken.appool.de/stations/fr-75012010 200 '^content-type: text/html'
          check https://genial-tanken.appool.de/datenschutz 200 '^content-type: text/html'
          check https://genial-tanken.appool.de/impressum 301 '^location: https://appool\.de/impressum$'
          check https://genial-tanken.appool.de/ngsw.json 200 '^cache-control: no-cache'
          check https://genial-tanken.appool.de/ngsw-worker.js 200 '^cache-control: no-cache'
          check https://genial-tanken.appool.de/missing-file.js 404 ''
