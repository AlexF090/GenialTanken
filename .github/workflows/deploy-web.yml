name: Deploy web

# Runs after CI finished on the default branch's copy of this file (workflow_run
# always uses the workflow definition from the default branch).
#
# Security model: workflow_run executes in the context of the base repository and
# has access to secrets. This workflow therefore never checks out or executes code
# from the triggering ref. It only downloads the static `web-dist` artifact that the
# successful CI run produced and uploads it to Cloudflare Pages. Runs without that
# artifact (CI skips all jobs for draft pull requests) skip the deploy instead of failing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-web-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  artifact:
    name: Check for web build
    # Only successful CI runs from this repository (pull requests from forks are skipped),
    # either for pull requests (preview) or for the main branch (production).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        (
          github.event.workflow_run.head_branch == 'main' &&
          contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # List the artifacts of the triggering CI run.
      actions: read
    outputs:
      web-dist-available: ${{ steps.lookup.outputs.web-dist-available }}
    steps:
      # CI skips every job for draft pull requests, yet such a run may still conclude with
      # `success`. Without a `web-dist` artifact there is nothing to deploy, so the deploy job is
      # skipped instead of failing. Only the GitHub API is queried; no code from the ref runs.
      - name: Look up web-dist artifact
        id: lookup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_IDENTIFIER: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: Number(process.env.RUN_IDENTIFIER),
              name: 'web-dist',
            });
            const isAvailable = data.artifacts.some((artifact) => !artifact.expired);
            if (!isAvailable) {
              core.notice('The CI run produced no web-dist artifact (for example a draft pull request); skipping deploy.');
            }
            core.setOutput('web-dist-available', String(isAvailable));

  deploy:
    name: Deploy to Cloudflare Pages
    needs: artifact
    if: needs.artifact.outputs.web-dist-available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Download the artifact of the triggering CI run.
      actions: read
    environment:
      name: ${{ github.event.workflow_run.event == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      alias-url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - name: Determine Pages branch
        id: target
        env:
          IS_PULL_REQUEST: ${{ github.event.workflow_run.event == 'pull_request' }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${IS_PULL_REQUEST}" != 'true' ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch names are user-controlled: reduce them to a safe alias charset
          # before they reach any command line.
          sanitized_branch="$(printf '%s' "${HEAD_BRANCH}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          if [ -z "${sanitized_branch}" ] || [ "${sanitized_branch}" = 'main' ]; then
            echo "::error::Cannot derive a preview branch name from '${HEAD_BRANCH}'."
            exit 1
          fi
          echo "branch=${sanitized_branch}" >> "$GITHUB_OUTPUT"

      - name: Download web build from CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact comes from a CI run of the pull request. Wrangler runs with the Cloudflare token
      # in this directory, so only the static build and the Pages Function may be present; any
      # configuration file wrangler or npm would read (wrangler.*, package.json, .npmrc) fails the job.
      - name: Verify artifact contents
        working-directory: web-dist
        run: |
          unexpected_top_level="$(find . -mindepth 1 -maxdepth 1 ! -name dist ! -name functions)"
          if [ -n "${unexpected_top_level}" ]; then
            echo "::error::Unexpected entries in web-dist: ${unexpected_top_level}"
            exit 1
          fi
          unexpected_files="$(find functions -type f ! -name '*.ts')"
          if [ -n "${unexpected_files}" ]; then
            echo "::error::Only TypeScript sources are allowed in functions/: ${unexpected_files}"
            exit 1
          fi
          if [ ! -f dist/web/browser/index.html ]; then
            echo '::error::dist/web/browser/index.html is missing.'
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.144.0
          # Wrangler picks up ./functions from the working directory and bundles it (no execution)
          workingDirectory: web-dist
          command: >-
            pages deploy dist/web/browser
            --project-name=genialtanken
            --branch=${{ steps.target.outputs.branch }}
            --commit-hash=${{ github.event.workflow_run.head_sha }}
            --commit-dirty=true

  comment:
    name: Post preview URL
    needs: deploy
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ALIAS_URL: ${{ needs.deploy.outputs.alias-url }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = '<!-- genialtanken-web-preview -->';
            const { owner, repo } = context.repo;
            const headSha = process.env.HEAD_SHA;

            let pullRequestNumber = Number(process.env.PULL_REQUEST_NUMBER);
            if (!pullRequestNumber) {
              // workflow_run.pull_requests can be empty; fall back to the commit lookup.
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha,
              });
              const openPullRequest = pullRequests.find((pullRequest) => pullRequest.state === 'open');
              if (!openPullRequest) {
                core.warning(`No open pull request found for commit ${headSha}; skipping comment.`);
                return;
              }
              pullRequestNumber = openPullRequest.number;
            }

            const lines = [
              marker,
              '### Web preview',
              '',
              '| | URL |',
              '| --- | --- |',
            ];
            if (process.env.ALIAS_URL) {
              lines.push(`| Branch preview | ${process.env.ALIAS_URL} |`);
            }
            lines.push(`| This commit | ${process.env.DEPLOYMENT_URL} |`);
            lines.push('', `Built from ${headSha}.`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequestNumber,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existingComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pullRequestNumber, body });
            }
