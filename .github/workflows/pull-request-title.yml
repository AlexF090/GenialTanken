name: Pull request title

# Pull requests are squash-merged and the squash commit takes the pull request title, so the title
# decides the next release (see release.yml). This check rejects titles that do not follow
# Conventional Commits, e.g. `feat(web): sort favorites` or `fix!: drop old favorites`.
on:
  pull_request:
    # `synchronize` too: the check is required, so it must also report on new commits, e.g. after
    # Dependabot rebases its pull requests.
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    # Draft pull requests are skipped, like in CI.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
