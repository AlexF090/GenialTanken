<ul class="station-list" role="list" aria-label="Tankstellen">
  @for (item of items(); track item.id) {
    <li
      class="station-row"
      [class.station-row--selected]="item.isSelected"
      [class.station-row--cheapest]="item.isCheapest"
      [attr.data-station-id]="item.id">
      <div class="station-row__details">
        @if (selectsOnMap()) {
          <button
            type="button"
            class="station-row__title"
            translate="no"
            [attr.aria-pressed]="item.isSelected"
            (click)="stationSelected.emit(item.id)">
            {{ item.title }}
          </button>
        } @else {
          <a class="station-row__title" translate="no" [routerLink]="['/stations', item.id]">{{
            item.title
          }}</a>
        }
        @if (item.subtitle) {
          <span class="station-row__line">{{ item.subtitle }}</span>
        }
        <span class="station-row__line">{{ item.addressLine }}</span>
        @if (item.distance) {
          <span class="station-row__line station-row__distance">{{ item.distance }}</span>
        }
      </div>
      <div class="station-row__price">
        @if (item.isCheapest) {
          <span class="station-row__cheapest-label">Günstigster Preis</span>
        }
        <app-price size="list" [priceInEuro]="item.priceInEuro" />
      </div>
      <div class="station-row__actions">
        @if (selectsOnMap()) {
          <a
            class="station-row__action"
            [routerLink]="['/stations', item.id]"
            [attr.aria-label]="'Details: ' + item.title">
            <app-icon name="info" />
          </a>
        }
        <app-favorite-button
          [stationName]="item.title"
          [isFavorite]="item.isFavorite"
          (toggled)="favoriteToggled.emit(item.id)" />
      </div>
    </li>
  }
</ul>
