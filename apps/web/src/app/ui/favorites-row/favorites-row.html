@if (cards().length > 0 || isLoading()) {
  <section class="favorites-row" [attr.aria-labelledby]="headingIdentifier">
    <div class="favorites-row__header">
      <h2 class="favorites-row__heading" [id]="headingIdentifier">Favoriten</h2>
      <a
        #allLink
        class="favorites-row__all"
        aria-label="Alle Favoriten"
        [routerLink]="favoritesRoute"
        >Alle</a
      >
    </div>
    @if (cards().length === 0) {
      <!-- Not live on purpose: the row loads silently next to the announced search results; this text only names the placeholders when read. -->
      <p class="visually-hidden">Favoriten werden geladen …</p>
      <app-skeleton-rows
        class="favorites-row__placeholders"
        variant="tile"
        [count]="placeholderCount()" />
    } @else {
      <ul class="favorites-row__list" role="list">
        @for (card of cards(); track card.stationIdentifier) {
          <li class="favorites-row__item">
            <a class="favorites-row__card" [routerLink]="card.route">
              <span class="favorites-row__title" translate="no">{{ card.title }}</span
              >&ngsp;
              <app-price
                class="favorites-row__price"
                size="list"
                [priceInEuro]="card.priceInEuro" />&ngsp;
              @if (card.distance) {
                <span class="favorites-row__distance">{{ card.distance }}</span>
              }
            </a>
          </li>
        }
      </ul>
    }
  </section>
}
