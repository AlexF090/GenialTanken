<section class="installation-hint" [attr.aria-labelledby]="headingIdentifier">
  <img class="installation-hint__icon" src="icons/icon-192.png" alt="" width="48" height="48" />
  <div class="installation-hint__text">
    <h2 class="installation-hint__heading" [id]="headingIdentifier">
      <span translate="no">{{ applicationName }}</span> als App
    </h2>
    @if (offer() === 'install-dialog') {
      <p>Auf dem Home-Bildschirm startet die Karte sofort und ohne Browserleisten.</p>
      <button
        type="button"
        class="button installation-hint__install"
        (click)="installRequested.emit()">
        Installieren
      </button>
    } @else {
      <p>
        Tippe auf <app-icon name="ios-share" class="installation-hint__share-icon" />&nbsp;Teilen
        und dann auf „Zum Home-Bildschirm“.
      </p>
    }
  </div>
  <button
    type="button"
    class="icon-button icon-button--circled installation-hint__dismiss"
    aria-label="Hinweis schließen"
    (click)="dismissed.emit()">
    <span class="icon-button__circle"><app-icon name="close" /></span>
  </button>
</section>
