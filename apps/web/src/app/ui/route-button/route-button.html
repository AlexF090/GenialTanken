<span class="route-button action-tile action-tile--primary">
  <app-icon name="directions" />
  <span class="action-tile__label" aria-hidden="true">Route</span>
  <select
    #select
    class="route-button__select"
    [attr.aria-label]="'Route zu ' + destination().name"
    (change)="openRoute(select)">
    <option value="" selected disabled>Route starten mit …</option>
    @for (app of apps; track app.identifier) {
      <option [value]="app.identifier">{{ app.label }}</option>
    }
  </select>
</span>
