<div class="place-search-field" role="search">
  <div class="place-search-field__bar">
    <app-icon name="search" class="place-search-field__icon" />
    <input
      #input
      type="search"
      class="place-search-field__input"
      role="combobox"
      aria-label="Ort suchen"
      aria-autocomplete="list"
      autocomplete="off"
      enterkeyhint="search"
      [attr.aria-expanded]="isListOpen()"
      [attr.aria-controls]="listboxIdentifier"
      [attr.aria-activedescendant]="activeOptionIdentifier()"
      [placeholder]="placeholder()"
      [value]="query()"
      (input)="handleInput(input.value)"
      (keydown)="handleKeydown($event)"
      (blur)="closeList()" />
    @if (query() !== '') {
      <button
        type="button"
        class="icon-button place-search-field__clear"
        aria-label="Suche löschen"
        (click)="clear()">
        <app-icon name="close" />
      </button>
    }
    <ng-content select="[placeSearchAccessory]" />
  </div>

  <div class="place-search-field__results" [hidden]="!isListOpen()">
    <ul
      class="place-search-field__listbox"
      role="listbox"
      aria-label="Orte"
      [id]="listboxIdentifier">
      @for (place of suggestions(); track place.id; let index = $index) {
        <li
          role="option"
          class="place-search-field__option"
          [id]="optionIdentifier(index)"
          tabindex="-1"
          [attr.aria-selected]="index === activeIndex()"
          (pointerdown)="keepFocus($event)"
          (click)="select(place)"
          (keydown.enter)="select(place)">
          <app-icon name="place" class="place-search-field__option-icon" />
          <span class="place-search-field__option-text">
            <span class="place-search-field__option-name">{{ place.name }}</span
            ><span class="visually-hidden">, </span>
            <span class="place-search-field__option-description">{{ place.description }}</span>
          </span>
        </li>
      }
    </ul>
    @if (statusMessage(); as message) {
      <p class="place-search-field__status">{{ message }}</p>
    }
  </div>
  <p class="visually-hidden" role="status">{{ announcement() }}</p>
</div>
