<app-page-header title="Details" [backLink]="backLink" />
<main class="page-content">
  <app-loading-state [isLoading]="isLoading()" label="Tankstelle wird geladen …" />
  @if (errorMessage(); as message) {
    <p class="message message--error" role="alert">{{ message }}</p>
  }
  @if (station(); as station) {
    <app-station-detail
      [station]="station"
      [fuelType]="fuelType()"
      [isFavorite]="isFavorite()"
      (favoriteToggled)="toggleFavorite()" />
    <!-- The Licence Ouverte requires the credit wherever French prices show. -->
    @if (station.country === 'FR') {
      <app-data-source-credit />
    }
  }
</main>
