<app-page-header title="Favoriten" />
<main class="page-content">
  @if (hasFavorites()) {
    <h2 #contentHeading class="visually-hidden" tabindex="-1">Gespeicherte Tankstellen</h2>
    <app-loading-state [isLoading]="isLoading()" label="Favoriten werden geladen …" />
    @if (errorMessage(); as message) {
      <p class="message message--error" role="alert">{{ message }}</p>
    }
    @if (unavailableMessage(); as message) {
      <div class="message unavailable-favorites">
        <p role="status">{{ message }}</p>
        <button type="button" class="button" (click)="removeUnavailableFavorites()">
          Nicht verfügbare Favoriten entfernen
        </button>
      </div>
    }
    <app-station-list
      [stations]="stations()"
      [fuelType]="fuelType()"
      [favoriteStationIds]="favoriteStationIds()"
      (favoriteToggled)="toggleFavorite($event)" />
  } @else {
    <div class="message">
      <h2 #contentHeading tabindex="-1">Keine Favoriten gespeichert</h2>
      <p>Tippe auf den Stern einer Tankstelle, um sie hier zu speichern.</p>
    </div>
  }
</main>
