<app-page-header title="Karte" />
<main class="map-page">
  <div class="map-page__status">
    <a routerLink="/">Tankstellen als Liste anzeigen</a>
    @if (locationErrorMessage(); as message) {
      <p class="message message--error" role="alert">{{ message }}</p>
    }
    @if (stationsErrorMessage(); as message) {
      <p class="message message--error" role="alert">{{ message }}</p>
    }
    <app-loading-state [isLoading]="isLoading()" />
  </div>
  <app-stations-map
    class="map-page__map"
    [stations]="stations()"
    [fuelType]="fuelType()"
    [center]="center()"
    [radiusInKilometers]="radiusInKilometers()"
    [cheapestStationIds]="cheapestStationIds()"
    [colorScheme]="colorScheme()"
    (stationSelected)="showStation($event)" />
</main>
